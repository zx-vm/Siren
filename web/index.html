<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0e1f" />
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #0a0e1f;
        --void-deep: #050711;
        --nebula-violet: #8b5cf6;
        --nebula-magenta: #ec4899;
        --signal-teal: #2dd4bf;
        --star-white: #f8fafc;
        --warn-amber: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(ellipse 120% 80% at 50% -10%, #141b38 0%, var(--void) 45%, var(--void-deep) 100%);
        color: var(--star-white);
        font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }

      ::selection {
        background: rgba(139, 92, 246, 0.35);
        color: #fff;
      }

      #starfield {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .nebula {
        position: fixed;
        border-radius: 50%;
        z-index: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        filter: blur(90px);
        will-change: transform, opacity;
      }
      .nebula--1 {
        width: 46vw;
        height: 46vw;
        max-width: 560px;
        max-height: 560px;
        background: var(--nebula-violet);
        top: -14%;
        left: -10%;
        opacity: 0.28;
        animation: drift1 34s ease-in-out infinite alternate;
      }
      .nebula--2 {
        width: 38vw;
        height: 38vw;
        max-width: 460px;
        max-height: 460px;
        background: var(--nebula-magenta);
        bottom: -16%;
        right: -8%;
        opacity: 0.22;
        animation: drift2 40s ease-in-out infinite alternate;
      }
      .nebula--3 {
        width: 34vw;
        height: 34vw;
        max-width: 420px;
        max-height: 420px;
        background: var(--signal-teal);
        top: 38%;
        right: 12%;
        opacity: 0.14;
        animation: drift3 46s ease-in-out infinite alternate;
      }
      @keyframes drift1 {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(4vw, 3vw) scale(1.15);
        }
      }
      @keyframes drift2 {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(-3vw, -2vw) scale(1.1);
        }
      }
      @keyframes drift3 {
        from {
          transform: translate(0, 0) scale(1);
          opacity: 0.14;
        }
        to {
          transform: translate(-3vw, 3vw) scale(1.2);
          opacity: 0.24;
        }
      }

      header,
      main {
        position: relative;
        z-index: 1;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.5rem 2rem;
        max-width: 1100px;
        margin: 0 auto;
      }

      .wordmark {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: clamp(1.1rem, 3vw, 1.25rem);
        letter-spacing: 0.08em;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.03em;
        white-space: nowrap;
        border: 1px solid rgba(248, 250, 252, 0.12);
        background: rgba(248, 250, 252, 0.04);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      }
      .badge-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        flex-shrink: 0;
      }
      .status-pill--connecting {
        color: #cbd5e1;
      }
      .status-pill--connecting .badge-dot {
        animation: blink 1.2s ease-in-out infinite;
      }
      .status-pill--online {
        color: var(--signal-teal);
        border-color: rgba(45, 212, 191, 0.35);
        box-shadow: 0 0 18px rgba(45, 212, 191, 0.15);
      }
      .status-pill--error {
        color: var(--warn-amber);
        border-color: rgba(251, 191, 36, 0.35);
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      .hero {
        text-align: center;
        padding: 2.75rem 1.5rem 2.25rem;
        max-width: 700px;
        margin: 0 auto;
      }

      .beacon {
        position: relative;
        width: clamp(140px, 32vw, 180px);
        height: clamp(140px, 32vw, 180px);
        margin: 0 auto 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .beacon-core {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        z-index: 2;
        transition: background 0.6s ease, box-shadow 0.6s ease;
      }
      .beacon-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid transparent;
        opacity: 0;
        will-change: transform, opacity;
      }

      .beacon--connecting .beacon-core {
        background: #94a3b8;
        box-shadow: 0 0 14px 2px rgba(148, 163, 184, 0.4);
        animation: pulseSoft 1.6s ease-in-out infinite;
      }
      .beacon--connecting .beacon-ring:nth-child(3) {
        inset: 12%;
        border-style: dashed;
        border-color: rgba(148, 163, 184, 0.55);
        opacity: 1;
        animation: scan 2.2s linear infinite;
      }

      .beacon--online .beacon-core {
        background: var(--signal-teal);
        box-shadow: 0 0 22px 4px rgba(45, 212, 191, 0.55);
      }
      .beacon--online .beacon-ring {
        border-color: var(--signal-teal);
        animation: ping 2.8s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
      }
      .beacon--online .beacon-ring:nth-child(1) {
        animation-delay: 0s;
      }
      .beacon--online .beacon-ring:nth-child(2) {
        animation-delay: 0.9s;
      }
      .beacon--online .beacon-ring:nth-child(3) {
        animation-delay: 1.8s;
      }

      .beacon--error .beacon-core {
        background: var(--warn-amber);
        box-shadow: 0 0 18px 3px rgba(251, 191, 36, 0.45);
        animation: pulseSoft 2.2s ease-in-out infinite;
      }
      .beacon--error .beacon-ring:nth-child(3) {
        inset: 18%;
        opacity: 0.35;
        border-color: var(--warn-amber);
      }

      @keyframes pulseSoft {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @keyframes scan {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ping {
        0% {
          transform: scale(0.25);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }

      .telemetry-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }
      @media (max-width: 680px) {
        .telemetry-grid {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        position: relative;
        background: rgba(248, 250, 252, 0.035);
        border: 1px solid rgba(248, 250, 252, 0.09);
        border-radius: 14px;
        padding: 1.35rem 1.5rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow: hidden;
        transition: transform 0.3s ease, border-color 0.3s ease;
      }
      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--nebula-violet), var(--signal-teal));
        opacity: 0.55;
      }
      .panel:hover {
        transform: translateY(-2px);
        border-color: rgba(248, 250, 252, 0.18);
      }

      .panel-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        color: rgba(248, 250, 252, 0.6);
        margin-bottom: 0.6rem;
      }
      .panel-value {
        font-family: "Space Grotesk", sans-serif;
        font-size: clamp(1.5rem, 5vw, 1.9rem);
        font-weight: 600;
        line-height: 1.1;
      }
      .panel-meta {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: rgba(248, 250, 252, 0.55);
        margin-top: 0.45rem;
      }

      footer {
        text-align: center;
        padding: 2.5rem 1.5rem 3rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: rgba(248, 250, 252, 0.5);
        letter-spacing: 0.03em;
      }

      header,
      .hero,
      .telemetry-grid,
      footer {
        animation: fadeUp 0.7s ease both;
      }
      header {
        animation-delay: 0s;
      }
      .hero {
        animation-delay: 0.12s;
      }
      .telemetry-grid {
        animation-delay: 0.24s;
      }
      footer {
        animation-delay: 0.36s;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .nebula,
        .beacon-ring,
        .beacon-core,
        .badge-dot,
        header,
        .hero,
        .telemetry-grid,
        footer {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="nebula nebula--1" aria-hidden="true"></div>
    <div class="nebula nebula--2" aria-hidden="true"></div>
    <div class="nebula nebula--3" aria-hidden="true"></div>

    <header>
      <div class="wordmark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="6" stroke="#8b5cf6" stroke-width="1.2" opacity="0.6" />
          <path d="M12 4.5V1.5M12 22.5V19.5M4.5 12H1.5M22.5 12H19.5" stroke="#2dd4bf" stroke-width="1.4" stroke-linecap="round" />
          <circle cx="12" cy="12" r="2.2" fill="#2dd4bf" />
        </svg>
        SIREN
      </div>
      <span id="status-badge" class="status-pill status-pill--connecting" role="status" aria-live="polite">
        <span class="badge-dot"></span>menghubungkan…
      </span>
    </header>

    <main>
      <section class="hero">
        <div id="beacon" class="beacon beacon--connecting" aria-hidden="true">
          <div class="beacon-ring"></div>
          <div class="beacon-ring"></div>
          <div class="beacon-ring"></div>
          <div class="beacon-core"></div>
        </div>
      </section>

      <section class="telemetry-grid">
        <div class="panel">
          <div class="panel-label">⟲ UPTIME</div>
          <div id="uptime" class="panel-value">—</div>
          <div id="since" class="panel-meta">—</div>
        </div>
        <div class="panel">
          <div class="panel-label">↑ UPLOAD</div>
          <div id="upload" class="panel-value">—</div>
        </div>
        <div class="panel">
          <div class="panel-label">↓ DOWNLOAD</div>
          <div id="download" class="panel-value">—</div>
        </div>
      </section>

      <footer>diperbarui pukul <span id="last-updated">—</span></footer>
    </main>

    <script>
      // ---------- Starfield ----------
      (function () {
        const canvas = document.getElementById("starfield");
        const ctx = canvas.getContext("2d");
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const palette = [
          [248, 250, 252],
          [248, 250, 252],
          [248, 250, 252],
          [191, 219, 254],
          [253, 230, 138],
        ];
        let stars = [];
        let shootingStars = [];
        let w, h;

        function resize() {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
          generateStars();
        }

        function generateStars() {
          const count = Math.floor((w * h) / 4500);
          stars = Array.from({ length: count }, () => ({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.4 + 0.3,
            baseAlpha: Math.random() * 0.5 + 0.3,
            speed: Math.random() * 0.0022 + 0.0008,
            phase: Math.random() * Math.PI * 2,
            color: palette[Math.floor(Math.random() * palette.length)],
          }));
        }

        function maybeSpawnShootingStar() {
          if (reduceMotion) return;
          if (shootingStars.length < 1 && Math.random() < 0.0008) {
            shootingStars.push({
              x: Math.random() * w * 0.6,
              y: Math.random() * h * 0.35,
              angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
              speed: Math.random() * 6 + 8,
              len: Math.random() * 70 + 60,
              life: 1,
            });
          }
        }

        function draw(time) {
          ctx.clearRect(0, 0, w, h);

          for (const s of stars) {
            const alpha = reduceMotion ? s.baseAlpha : s.baseAlpha + Math.sin(time * s.speed + s.phase) * 0.25;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${Math.max(0, Math.min(1, alpha))})`;
            ctx.fill();
          }

          maybeSpawnShootingStar();
          shootingStars = shootingStars.filter((s) => s.life > 0);
          for (const s of shootingStars) {
            const dx = Math.cos(s.angle) * s.speed;
            const dy = Math.sin(s.angle) * s.speed;
            const tailX = s.x - dx * (s.len / s.speed);
            const tailY = s.y - dy * (s.len / s.speed);

            const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
            grad.addColorStop(0, `rgba(248,250,252,${s.life})`);
            grad.addColorStop(1, "rgba(248,250,252,0)");
            ctx.strokeStyle = grad;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            s.x += dx;
            s.y += dy;
            s.life -= 0.02;
          }
        }

        function loop(time) {
          draw(time);
          if (!reduceMotion) requestAnimationFrame(loop);
        }

        window.addEventListener("resize", resize);
        resize();
        loop(0);
      })();

      // ---------- Stats ----------
      function formatBytes(bytes) {
        if (!bytes || bytes <= 0) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
        const value = bytes / Math.pow(1024, i);
        return `${value.toFixed(i === 0 ? 0 : 2)} ${units[i]}`;
      }

      function formatUptime(seconds) {
        seconds = Math.max(0, Math.floor(seconds));
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const parts = [];
        if (d) parts.push(`${d}h`);
        if (h || d) parts.push(`${h}j`);
        parts.push(`${m}m`);
        return parts.join(" ");
      }

      function setConnectionState(state) {
        const badge = document.getElementById("status-badge");
        const beacon = document.getElementById("beacon");

        beacon.classList.remove("beacon--connecting", "beacon--online", "beacon--error");
        badge.classList.remove("status-pill--connecting", "status-pill--online", "status-pill--error");
        beacon.classList.add(`beacon--${state}`);
        badge.classList.add(`status-pill--${state}`);

        if (state === "connecting") {
          badge.innerHTML = '<span class="badge-dot"></span>menghubungkan…';
        } else if (state === "online") {
          badge.innerHTML = '<span class="badge-dot"></span>online';
        } else {
          badge.innerHTML = '<span class="badge-dot"></span>terputus';
        }
      }

      async function refreshStats() {
        try {
          const res = await fetch("/api/stats", { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();

          document.getElementById("uptime").textContent = formatUptime(data.uptime_seconds);
          document.getElementById("since").textContent = "sejak " + new Date(data.first_seen).toLocaleString("id-ID");
          document.getElementById("upload").textContent = formatBytes(data.up_bytes);
          document.getElementById("download").textContent = formatBytes(data.down_bytes);
          document.getElementById("last-updated").textContent = new Date().toLocaleTimeString("id-ID");

          setConnectionState("online");
        } catch (e) {
          setConnectionState("error");
        }
      }

      setConnectionState("connecting");
      refreshStats();
      let pollInterval = setInterval(refreshStats, 15000);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearInterval(pollInterval);
          pollInterval = null;
        } else {
          refreshStats();
          pollInterval = setInterval(refreshStats, 15000);
        }
      });
    </script>
  </body>
</html>
